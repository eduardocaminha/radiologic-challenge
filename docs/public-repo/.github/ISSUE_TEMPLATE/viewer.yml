name: Enviar uma workstation
description: Envie sua workstation, ou uma parte dela, para o Radiologic Workstation.
title: "[Workstation] "
labels:
  - submissão
body:
  - type: input
    id: name
    attributes:
      label: Nome da workstation
      description: Use o nome público do projeto.
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Frase de apresentação
      description: Explique o projeto em uma frase curta.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que o projeto faz e como foi pensado. Até 2.000 caracteres.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitações
      description: O que ainda não funciona. Até 500 caracteres.
  - type: input
    id: differential
    attributes:
      label: Diferencial
      description: O que torna este projeto diferente?
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Idioma do projeto
      options:
        - pt
        - en
        - es
    validations:
      required: true
  - type: checkboxes
    id: workflow_parts
    attributes:
      label: Partes da workstation
      description: Selecione pelo menos uma. Vale enviar só uma parte do fluxo.
      options:
        - label: Viewer
        - label: Pilha
        - label: IA
        - label: Agente
        - label: Laudo
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Plataformas
      description: Selecione pelo menos uma opção.
      options:
        - label: web
        - label: desktop
        - label: mobile
        - label: xr
    validations:
      required: true
  - type: dropdown
    id: requires_install
    attributes:
      label: Exige instalação
      options:
        - "Sim"
        - "Não"
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repositório público
      placeholder: https://github.com/...
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Licença SPDX
      placeholder: MIT
    validations:
      required: true
  - type: dropdown
    id: base_tech
    attributes:
      label: Tecnologia base
      options:
        - scratch
        - ohif
        - cornerstone3d
        - vtkjs
        - dwv
        - niivue
        - volview
        - other
    validations:
      required: true
  - type: input
    id: data_source
    attributes:
      label: Fonte dos dados
    validations:
      required: true
  - type: input
    id: data_license
    attributes:
      label: Licença dos dados
    validations:
      required: true
  - type: dropdown
    id: external_api
    attributes:
      label: Usa API externa
      options:
        - "Não"
        - "Sim"
    validations:
      required: true
  - type: input
    id: external_api_detail
    attributes:
      label: Detalhes da API externa
  - type: input
    id: demo_url
    attributes:
      label: URL da demonstração
      placeholder: https://...
  - type: input
    id: download_url
    attributes:
      label: URL do download
      placeholder: https://...
  - type: input
    id: video_url
    attributes:
      label: URL do vídeo
      placeholder: https://...
  - type: input
    id: author_name
    attributes:
      label: Nome do autor
  - type: dropdown
    id: author_profile
    attributes:
      label: Perfil do autor
      options:
        - radiologist
        - resident
        - physician
        - developer
        - student
        - physicist
        - team
  - type: input
    id: country
    attributes:
      label: País
      description: Use o código ISO 3166-1 alfa-2, por exemplo BR.
  - type: checkboxes
    id: dicomweb
    attributes:
      label: Usa DICOMweb
      options:
        - label: Sim
  - type: input
    id: stack
    attributes:
      label: Stack
  - type: checkboxes
    id: features
    attributes:
      label: Recursos
      options:
        - label: 2d
        - label: 3d
        - label: mpr
        - label: measurements
        - label: annotations
        - label: segmentation
        - label: fusion
        - label: cine
        - label: hanging_protocols
        - label: ai
        - label: export
        - label: comparison
        - label: windowing
        - label: collaboration
        - label: other
  - type: checkboxes
    id: modalities
    attributes:
      label: Modalidades
      options:
        - label: ct
        - label: mr
        - label: us
        - label: xr
        - label: nm
        - label: pt
        - label: mg
        - label: cr
        - label: dx
        - label: rf
        - label: xa
        - label: sc
        - label: ot
        - label: other
  - type: textarea
    id: ai_tools
    attributes:
      label: Ferramentas de IA
      description: Uma por linha, no formato "nome, versão". Até 10.
  - type: dropdown
    id: ai_code_share
    attributes:
      label: Participação de código de IA
      options:
        - none
        - lt25
        - 25to75
        - gt75
        - all
  - type: input
    id: prompts_url
    attributes:
      label: URL dos prompts
      placeholder: https://...
  - type: dropdown
    id: time_spent
    attributes:
      label: Tempo investido
      options:
        - lt1d
        - 1to7d
        - 1to4w
        - gt1m
  - type: dropdown
    id: cost
    attributes:
      label: Custo
      options:
        - lt10
        - 10to100
        - 100to1000
        - gt1000
  - type: markdown
    attributes:
      value: Depois de enviar, entre no site com a mesma conta do GitHub para adicionar as imagens, aceitar o regulamento e mandar para moderação.
